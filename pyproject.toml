[project]
name = "call-tradutor"
version = "0.1.0"
description = "Tradução de call em tempo real, 100% local: legenda EN→PT e voz PT→EN"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.2",
    "soundcard>=0.4.3",
    "PySide6>=6.7",
    "kokoro-onnx>=0.4",
    "httpx>=0.27",
    "numpy",
    "pynput>=1.7",
]

[project.optional-dependencies]
# GPU NVIDIA (Windows/Linux). onnxruntime-gpu 1.22 é a última com CUDA 12, que o faster-whisper usa.
gpu = [
    "onnxruntime-gpu==1.22.0",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9,<10",
    "nvidia-cuda-runtime-cu12",
    "nvidia-cufft-cu12",
    "nvidia-curand-cu12",
]
# Sem GPU NVIDIA (ex.: Mac): tudo na CPU, mais lento. Use stt.device = "cpu" e compute_type = "int8".
cpu = ["onnxruntime>=1.18"]

[project.scripts]
call-tradutor = "call_tradutor.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
