# Configuração do call-tradutor.
# Nomes de dispositivo aceitam trecho do nome (ex.: "Fifine"). Vazio = padrão do sistema.
# Rode `python scripts/listar_dispositivos.py` para ver os nomes disponíveis.

[audio]
# "processo" = escuta todo o som do PC menos o do próprio app (a dublagem não volta na captura,
# então nada do que a outra pessoa fala se perde). "dispositivo" = modo antigo, pelo loopback_device.
listen_capture = "processo"
loopback_device = "Realtek"   # saída que você ouve (fone) — a mesma do "Alto-falante" do app da call. Vazio = saída padrão do Windows
mic_device = "Fifine"         # seu microfone. Vazio = microfone padrão
cable_device = "CABLE Input"  # microfone virtual (VB-Cable). Na call, escolha "CABLE Output" como microfone

[stt]
# idioma da outra pessoa: "en" fixo é mais rápido e não erra a detecção. Vazio = detecta sozinho
listen_language = "en"
model = "large-v3-turbo"
device = "cuda"
compute_type = "float16"
# termos que o Whisper deve reconhecer (nomes, tecnologias, empresas)
hotwords = "React, Next.js, TypeScript, NestJS, React Native, Flutter, Angular, Figma, Tailwind, Playwright, micro-frontends, feature flags, front-end, back-end, full-stack, XP Investimentos, Gengi, Kudo"

[translate]
ollama_url = "http://127.0.0.1:11434"  # 127.0.0.1, não "localhost": no Windows o localhost soma ~2 s
# qwen3:8b   → padrão: boa tradução, ~0,4 s, ~6 GB de VRAM
# gemma3:12b → tradução mais natural, ~0,8 s, mas ocupa quase toda a GPU de 12 GB junto com o Whisper
# qwen2.5:7b → mais leve, traduz expressões ao pé da letra
model = "qwen3:8b"
context_turns = 3             # quantas falas anteriores entram como contexto
keep_alive = "5m"             # modelo sai da memória após 5 min sem uso (e na hora ao fechar o app)

[tts]
voice = "am_michael"          # outras: am_adam, af_heart, af_bella, bm_george, bf_emma
speed = 1.0
model_path = "models/kokoro-v1.0.onnx"
voices_path = "models/voices-v1.0.bin"

[dub]
# Dublagem: o que a pessoa fala em inglês sai também em áudio, em português, no seu fone.
# Enquanto a dublagem toca, a captura da call pausa (senão o programa ouviria a si mesmo).
enabled = true               # carrega a dublagem (botão 🔊 / Ctrl+Alt+D liga e desliga)
start_on = true               # começa ligada (botão 🔊 desliga se em fala contínua ela não acompanhar)
voice = "pm_alex"             # vozes PT do Kokoro: pm_alex, pm_santa, pf_dora
speed = 1.25                  # um pouco acelerada, para a dublagem acompanhar quem fala rápido
device = ""                   # vazio = o mesmo fone do loopback_device
duck = 0.28                   # enquanto a dublagem fala, o som original (Meet) cai para 28%. 1 = não abaixa (ajustável no ⚙)

[coach]
# Sugestão de resposta: quando a pessoa termina de falar, sugere o que você pode dizer,
# com base no perfil.md (sua experiência) e na conversa até ali.
enabled = true
name = "Claudio"              # seu nome, como aparece na conversa
turn_gap_s = 1.2              # silêncio da outra pessoa que conta como "terminou de falar"
profile = "perfil.md"

[vad]
threshold = 0.5               # 0–1, maior = exige fala mais clara
silence_ms = 700              # pausa que fecha a frase (os "hmm" sozinhos já são ignorados)
min_speech_ms = 250           # ignora ruídos mais curtos que isso
soft_max_s = 3.0              # depois de 3 s, a próxima respiração já fecha o trecho
max_utterance_s = 6.0         # corte forçado para quem fala sem parar
soft_silence_ms = 100         # "respiração": pausa mínima para esse corte (entre palavras é menos)

[vad_falar]
# A sua fala, quase em tempo real: trechos curtos (~2 s) cortados nas respirações, para a voz em
# inglês começar enquanto você ainda fala. A tradução recebe as falas anteriores como contexto.
silence_ms = 300              # pausa que fecha a frase
soft_max_s = 1.8              # depois de 1,8 s, a próxima respiração já fecha o trecho
soft_silence_ms = 100         # "respiração": pausa mínima para esse corte
max_utterance_s = 3.5         # corte forçado (no ponto de fala mais fraca) para quem não respira

[ui]
font_size = 22
opacity = 0.88
history = 3                   # quantas legendas ficam na tela
partials = true               # prévia já traduzida (cinza) enquanto a pessoa fala
partial_every_s = 0.45        # de quanto em quanto tempo a prévia atualiza

[hotkeys]
toggle_mic = "<ctrl>+<alt>+m"      # liga/desliga a tradução da sua fala
toggle_captions = "<ctrl>+<alt>+l" # liga/desliga a legenda
toggle_dub = "<ctrl>+<alt>+d"      # liga/desliga a dublagem em português no fone
toggle_coach = "<ctrl>+<alt>+r"    # liga/desliga a sugestão de resposta
clear = "<ctrl>+<alt>+c"           # limpa a tela e o contexto da conversa
quit = "<ctrl>+<alt>+q"            # encerra o app (o mesmo que o ✕)
